name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    # arm64 macOS mirrors the student platform. No Metal GPU on CI runners:
    # MPS-dependent tests skip via their own guards.
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install project
        run: |
          uv venv --python 3.11 .venv
          source .venv/bin/activate
          uv pip install -e ".[dev,baselm]"

      - name: Scaffold invariant (solutions must not leak into g2c/)
        run: |
          source .venv/bin/activate
          pytest tests/test_scaffold_invariant.py

      - name: Full suite with solutions applied
        run: |
          source .venv/bin/activate
          G2C_APPLY_SOLUTIONS=1 pytest
