[project]
name = "g2c"
version = "0.0.1"
description = "From Gradients to ChatGPT — work-product package"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Douglas Colkitt" }]
requires-python = ">=3.11"
dependencies = [
    "torch>=2.4",
    "numpy>=1.26",
    "tokenizers>=0.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
    "jupyter>=1.0",
    "matplotlib>=3.8",
    "torchvision>=0.19",
    "datasets>=3.0",
]
baselm = [
    "transformers>=4.51",
    "safetensors>=0.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["g2c"]

[tool.ruff]
line-length = 100
target-version = "py311"
# Student notebooks are exercise surfaces, not lint targets.
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]

[tool.ruff.lint.per-file-ignores]
# The solutions mirror is patched onto the scaffold package at runtime:
# imports mirror the scaffold surface (F401), names resolve only after
# binding (F821), and impl imports follow patcher plumbing (E402).
"g2c/solutions/**" = ["F401", "F821", "E402"]
# Usage examples in the header docstring are copy-paste commands; keep one line.
"scripts/sysprobe.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
